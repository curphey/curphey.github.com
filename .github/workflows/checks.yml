# Every change runs the unit tests and plays the game in a browser, and the site is published only when both pass.
name: checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: Browser checks to run
        default: loads founders-scene taps taps-phone ride eggs passage departure offline zoom

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Puzzle and privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test

  # GitHub's machines have no graphics card, so the game runs in its low-detail mode and draws only every 40th
  # frame (VERIFY_LITE). That checks behaviour, not looks: looks are checked on a real graphics card before merging.
  browser:
    name: Play every scene in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # "taps" plays each scene with real taps only; the rest cover loading, layout, passages and the hidden things.
      - run: node pieces/voyage/verify.mjs ${{ inputs.checks || 'loads founders-scene taps taps-phone ride eggs passage departure offline zoom' }}
        env: { VERIFY_OUT: screenshots, VERIFY_LITE: 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: screenshots, if-no-files-found: ignore }

  publish:
    name: Publish to curphey.com
    needs: [unit, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the site itself is published: no tests, tooling or agent files.
      - run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '.claude' --exclude '_site' --exclude 'package*.json' \
            --exclude '*.test.mjs' --exclude 'verify.mjs' --exclude 'node_modules' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
