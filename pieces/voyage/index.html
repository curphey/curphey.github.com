<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Curphey Family Web Site</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <canvas id="view" aria-label="A puzzle scene"></canvas>
  <header>
    <a class="brand" href="/">curphey<span>.</span></a>
    <details id="menu">
      <summary aria-label="Help and options"><span></span><span></span><span></span></summary>
      <div class="panel">
        <p>Tap a walkway to walk there. Drag a tower's bridge to turn it, or tap its brass handle.</p>
        <div class="row"><button id="hint">Hint</button><button id="sound" aria-pressed="false">Sound off</button><button id="restart">Begin again</button><button id="auto" aria-pressed="false">Watch it play</button><button id="switch" hidden>Switch traveller</button></div>
        <details class="keys"><summary>Keyboard controls</summary>
          <h2>Walk to</h2><div id="walks" class="row"></div>
          <h2>Turn</h2><div id="turns" class="row"></div>
        </details>
        <details class="keys"><summary>Scenes</summary><div id="chapters" class="row"></div></details>
      </div>
    </details>
  </header>
  <p id="goal"><span>Goal</span><b></b></p>
  <section class="title" id="title"><span class="eyebrow"></span><h1></h1><p id="subtitle"></p></section>
  <p id="who"><i></i><span>Moving</span><b></b></p>
  <p id="status" role="status"></p>
  <p id="passage" aria-live="polite"></p>
  <section class="finish" id="finish" hidden><span class="eyebrow">Scene complete</span><h2></h2><p></p><div class="row centre"><button id="again">Play again</button><button id="next" hidden>Next scene</button></div></section>
  <section id="term" hidden aria-label="Terminal"><pre id="term-out"></pre><form><label for="term-in">007@disco-volante:~#</label><input id="term-in" autocomplete="off" autocapitalize="off" spellcheck="false"></form></section>
  <p id="loading">Laying bricks…</p>
  <script>/* Arriving from a passage: stay in the mist instead of showing the loading card. */(function () { var q = new URLSearchParams(location.search), m = q.get('mist'); if (q.has('arrive') && /^[0-9a-f]{6}$/i.test(m || '')) { var l = document.getElementById('loading'); l.textContent = ''; l.style.background = '#' + m; } })();</script>
</main>
<script type="module" src="world.js"></script>
</body>
</html>
